name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing
        run: npm install -g npm@^11.15
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Check that the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - name: Stage on npm (approve it on npmjs.com with 2FA)
        run: |
          v="$(node -p 'require("./package.json").version')"
          if npm view "rewind-stream@$v" version >/dev/null 2>&1; then
            echo "rewind-stream@$v is already on npm: nothing to stage."
          else
            npm stage publish --provenance --access public
            echo "::notice title=Approve on npm::rewind-stream@$v is staged. Approve it at https://www.npmjs.com/settings/andreaaca/staged-packages"
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" rewind-stream-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
