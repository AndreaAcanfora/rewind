name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser test (demo page and native EventSource)
        run: npm run e2e
      - name: Conformance of the demo server
        run: |
          PORT=3000 node demo/server.ts &
          sleep 1
          loc=$(curl -s -D - -o /dev/null -X POST -H 'content-type: application/json' -d '{"prompt":"ci"}' http://127.0.0.1:3000/chat | tr -d '\r' | awk 'tolower($1)=="stream-location:"{print $2}')
          sleep 8
          node dist/conformance/cli.js "http://127.0.0.1:3000$loc"
