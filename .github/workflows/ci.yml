name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser test (demo page and native EventSource)
        run: npm run e2e
      - name: Conformance of the demo server
        run: |
          PORT=3000 node demo/server.ts &
          sleep 1
          loc=$(curl -s -D - -o /dev/null -X POST -H 'content-type: application/json' -d '{"prompt":"ci"}' http://127.0.0.1:3000/chat | tr -d '\r' | awk 'tolower($1)=="stream-location:"{print $2}')
          sleep 8
          node dist/conformance/cli.js "http://127.0.0.1:3000$loc"

  redis:
    name: RedisStore against Redis 7
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests, including RedisStore
        env:
          REDIS_URL: redis://localhost:6379
        run: npm test

  python:
    name: Python server (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - name: Tests, including RedisStore
        env:
          REDIS_URL: redis://localhost:6379
        run: python -m unittest discover -s tests -t . -v
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check . && uvx ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TypeScript conformance suite against the Python server
        run: |
          (cd .. && npm ci && npm run build)
          (cd examples && uvicorn demo:app --port 8000 &)
          sleep 2
          loc=$(curl -s -D - -o /dev/null -X POST -H 'content-type: application/json' -d '{"prompt":"ci"}' http://127.0.0.1:8000/chat | tr -d '\r' | awk 'tolower($1)=="stream-location:"{print $2}')
          sleep 3
          node ../dist/conformance/cli.js "http://127.0.0.1:8000$loc"

