name: Python release

# Publishes the Python package (python/) to PyPI with trusted publishing.
# Tags are py-vX.Y.Z, separate from the npm releases (vX.Y.Z).
on:
  push:
    tags: ["py-v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag" = "$version" || { echo "tag $tag does not match version $version"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
